server:
  port: "50053"
mongodb:  
  host: localhost
  port: 27017          
  password: ""     
  db: relationships 
rabbitmq:
  host: localhost     
  port: 5672                
  name: guest         
  password: guest       
  queue: relationships-queue
  exchange: user-events-exchange
